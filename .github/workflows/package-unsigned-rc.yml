name: Package Unsigned Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-unsigned-rc:
    name: Build Unsigned Release Candidate (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.20.0
          cache: npm

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Run Frontend Security Audit
        run: npm audit --audit-level=high

      - name: Build Frontend Application
        run: npm run build

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri

      - name: Rust Security Audit
        run: cargo install cargo-audit --version 0.22.1 --locked && cargo audit --file src-tauri/Cargo.lock

      - name: Check Rust Code Formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --all-targets --locked
        working-directory: src-tauri

      - name: Run Rust Library Tests
        run: cargo test --lib --locked
        working-directory: src-tauri

      - name: Run Rust All-Feature Tests
        run: cargo test --workspace --all-features --all-targets --locked
        working-directory: src-tauri

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        working-directory: src-tauri

      - name: Audit Native Artifact Manifests
        run: node scripts/audit/update-artifact-manifest.js

      - name: Verify Version Consistency
        run: node scripts/release/check-version.cjs

      - name: Build Unsigned Tauri Application
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          args: --bundles nsis --config src-tauri/tauri.unsigned.conf.json
          includeUpdaterJson: false

      - name: Install verified pinned 7-Zip
        shell: powershell
        run: |
          $metadata = Get-Content scripts/release/tools/7zip.json -Raw | ConvertFrom-Json
          $installer = Join-Path $env:RUNNER_TEMP "7zip-$($metadata.version)-x64.exe"
          Invoke-WebRequest -Uri $metadata.downloadUrl -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $metadata.sha256) { throw "7-Zip installer SHA-256 mismatch" }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "7-Zip installation failed: $($process.ExitCode)" }
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) { throw "Verified 7-Zip executable missing" }

      - name: Verify Packaged Resources
        shell: powershell
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*setup.exe | Select-Object -First 1).FullName
          node scripts/release/verify-packaged-resources.cjs --installer $installer --extractor 'C:\Program Files\7-Zip\7z.exe' --output artifacts/evidence/nsis-package-verification.json

      - name: Generate Software Bill of Materials (SBOM)
        run: node scripts/release/generate-sbom.cjs

      - name: Generate SHA256 Checksums
        shell: powershell
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*setup.exe | Select-Object -First 1).FullName
          node scripts/release/generate-checksums.cjs --installer $installer

      - name: Generate Release Readiness Manifest
        run: node scripts/release/create-release-metadata.cjs
        env:
          COMPLETED_GATES: frontend-tests,frontend-build,npm-audit,rust-lib-tests,rust-all-targets,rust-all-features,cargo-fmt,clippy,cargo-audit,version-parity,native-manifest,nsis-build,nsis-package-verification,installer-checksum

      - name: Upload Unsigned Release Candidate Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-rc-1.0.0-rc.1-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/
          if-no-files-found: error
          retention-days: 14
