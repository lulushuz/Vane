name: "Archey Vane: Production Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.93.0

      - name: Rust Cache (Build Speed Optimization)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: npm ci

      - name: Verify Version and Tag Consistency
        shell: bash
        run: |
          PACKAGE_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "Package Version: $PACKAGE_VER"
          echo "Tauri Version:   $TAURI_VER"
          echo "Tag Version:     $TAG_VER"
          if [ "$PACKAGE_VER" != "$TAURI_VER" ] || [ "$PACKAGE_VER" != "$TAG_VER" ]; then
            echo "ERROR: Version mismatch between package.json ($PACKAGE_VER), tauri.conf.json ($TAURI_VER), and tag ($TAG_VER)"
            exit 1
          fi

      - name: Validate Bundled Zapret Binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            WINWS="src-tauri/binaries/winws-x86_64-pc-windows-msvc.exe"
            DIVERT="src-tauri/binaries/WinDivert64.sys"
            if [ ! -s "$WINWS" ] || [ ! -s "$DIVERT" ]; then
              echo "ERROR: Bundled Zapret binary missing or 0 bytes ($WINWS, $DIVERT)"
              exit 1
            fi
            echo "Zapret binaries validated."
          fi

      - name: Build and Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vane ${{ github.ref_name }}"
          releaseBody: "Vane Pre-Release v0.1.0 by Archey Inc."
          releaseDraft: false
          prerelease: true
